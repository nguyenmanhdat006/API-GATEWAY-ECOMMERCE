server:
  port: 8080
  tomcat:
    connection-timeout: 20000ms

gateway:
  public-paths:
    - /api/auth/**

    - /api/products/**
    - /api/categories/**
    - /api/brands/**

    - /api/uploads/**

    - /actuator/health
    - /actuator/health/**

    - /swagger-ui/**
    - /v3/api-docs/**
    - /swagger-ui.html

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        compression: true

      routes:
        - id: product-service
          uri: ${services.product-url}
          predicates:
            - Path=/api/products/**, /api/categories/**, /api/brands/**
        - id: cart-service
          uri: ${services.cart-url}
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: ${services.order-url}
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: ${services.payment-url}
          predicates:
            - Path=/api/payments/**
        - id: auth-service
          uri: ${services.auth-url}
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: review-service
          uri: ${services.review-url}
          predicates:
            - Path=/api/reviews/**
        - id: notification-service
          uri: ${services.notification-url}
          predicates:
            - Path=/api/notifications/**
        - id: shipping-service
          uri: ${services.shipping-url}
          predicates:
            - Path=/api/shipping/**
        - id: storage-service
          uri: ${services.storage-url}
          predicates:
            - Path=/api/uploads/**
          filters:
            - StripPrefix=1
        - id: socket-gateway-chat
          uri: ${services.socket-gateway-url}
          predicates:
            - Path=/api/chat/**

      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET,POST,PUT
            backoff:
              firstBackoff: 50ms
              maxBackoff: 1600ms
              factor: 2
              basedOnPreviousValue: false


services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  cart-url: ${CART_SERVICE_URL:http://localhost:8083}
  order-url: ${ORDER_SERVICE_URL:http://localhost:8084}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  review-url: ${REVIEW_SERVICE_URL:http://localhost:8086}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  shipping-url: ${SHIPPING_SERVICE_URL:http://localhost:8088}
  storage-url: ${STORAGE_SERVICE_URL:http://localhost:8089}
  socket-gateway-url: ${SOCKET_GATEWAY_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,metrics,prometheus
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

logging:
  level:
    root: INFO
    com.ecommerce.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
