server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Enable route discovery from RouteLocator bean
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # Add global filters
      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET,POST,PUT
            backoff:
              firstBackoff: 50ms
              maxBackoff: 1600ms
              factor: 2
              basedOnPreviousValue: false

    # Eureka client configuration
    discovery:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/

  # Enable actuator endpoints for monitoring
  endpoints:
    web:
      exposure:
        include: gateway,health

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true
